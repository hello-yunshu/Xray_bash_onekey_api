name: Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto_update.yml'
      - 'update-version.sh'
      - 'validate-json.sh'
      - 'tested_versions.json'
      - '.github/workflows/promote_tested_version.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Auto-Update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Install jq curl
      run: sudo apt-get update && sudo apt-get install -y jq curl

    - name: Make scripts executable
      run: chmod +x update-version.sh validate-json.sh
    
    - name: Backup xray_shell_versions.json
      run: |
        if [ -f xray_shell_versions.json ]; then
          cp xray_shell_versions.json xray_shell_versions_backup.json
        else
          echo "{}" > xray_shell_versions_backup.json
        fi
    
    - name: Run script
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
          echo "Forcing re-generation of xray_shell_versions.json"
          bash update-version.sh --force
        else
          echo "Running regular update script"
          bash update-version.sh
        fi

    - name: Validate updated JSON
      id: validate_json
      run: |
        if ! ./validate-json.sh; then
          echo "Validation failed. Restoring backup..."
          if [ -f xray_shell_versions_backup.json ]; then
            mv xray_shell_versions_backup.json xray_shell_versions.json
            git checkout -- xray_shell_versions.json
          fi
          exit 1
        fi
    
    - name: Push changes
      uses: ad-m/github-push-action@7fba72704ad2db819788db8f2d9e7d1dfbebe089 # master @ 2026-11-05
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Refresh CDN cache
      if: success() && steps.validate_json.outcome == 'success'
      run: |
        curl -f https://purge.jsdelivr.net/gh/hello-yunshu/Xray_bash_onekey_api@main/xray_shell_versions.json || echo "Failed to download the file"

    - name: Cleanup
      if: always()
      run: |
        rm -f xray_shell_versions_backup.json
