name: Verify and Promote Upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: verify-promote-upstreams
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      candidate_version: ${{ steps.discover.outputs.candidate_version }}
      current_xray_version: ${{ steps.discover.outputs.current_xray_version }}
      xray_changed: ${{ steps.discover.outputs.xray_changed }}
      main_sha: ${{ steps.discover.outputs.main_sha }}
      current_installer_ref: ${{ steps.discover.outputs.current_installer_ref }}
      current_installer_sha: ${{ steps.discover.outputs.current_installer_sha }}
      installer_candidate_ref: ${{ steps.discover.outputs.installer_candidate_ref }}
      installer_candidate_sha: ${{ steps.discover.outputs.installer_candidate_sha }}
      installer_changed: ${{ steps.discover.outputs.installer_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: discover
        run: bash .github/scripts/discover_upstream_candidates.sh

  qualify-xray:
    needs: discover
    if: needs.discover.outputs.xray_changed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: hello-yunshu/Xray_bash_onekey
          ref: ${{ needs.discover.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact qualification inputs
        run: |
          printf 'MAIN_REPO_SHA=%s\nXRAY_CANDIDATE=%s\nINSTALLER_REF=%s\n' \
            '${{ needs.discover.outputs.main_sha }}' \
            '${{ needs.discover.outputs.candidate_version }}' \
            '${{ needs.discover.outputs.current_installer_ref }}'
      - name: Five-mode fresh install qualification
        env:
          XRAY_CANDIDATE_VERSION: ${{ needs.discover.outputs.candidate_version }}
          XRAY_CANDIDATE_INSTALLER_REF: ${{ needs.discover.outputs.current_installer_ref }}
          XRAY_CANDIDATE_INSTALLER_SHA256: ${{ needs.discover.outputs.current_installer_sha }}
        run: |
          set -euo pipefail
          for mode in xtls_only ws_grpc_xhttp reality reality_nginx tls; do
            sudo -E bash .github/test/test_install.sh "$mode"
          done
      - name: Existing transaction rollback regression
        run: bash .github/test/test_xray_update_transaction.sh
      - name: Representative real upgrade qualification
        env:
          BASE_XRAY_VERSION: ${{ needs.discover.outputs.current_xray_version }}
          XRAY_CANDIDATE_VERSION: ${{ needs.discover.outputs.candidate_version }}
          XRAY_CANDIDATE_INSTALLER_REF: ${{ needs.discover.outputs.current_installer_ref }}
          XRAY_CANDIDATE_INSTALLER_SHA256: ${{ needs.discover.outputs.current_installer_sha }}
        run: sudo -E bash .github/test/test_candidate_real_upgrade.sh

  qualify-installer:
    needs: discover
    if: needs.discover.outputs.installer_changed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: hello-yunshu/Xray_bash_onekey
          ref: ${{ needs.discover.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Installer contract and representative real install
        env:
          XRAY_CANDIDATE_INSTALLER_REF: ${{ needs.discover.outputs.installer_candidate_ref }}
          XRAY_CANDIDATE_INSTALLER_SHA256: ${{ needs.discover.outputs.installer_candidate_sha }}
        run: |
          set -euo pipefail
          bash -n install.sh
          sudo -E bash .github/test/test_install.sh reality
          bash .github/test/test_xray_update_transaction.sh

  promote-xray:
    needs: [discover, qualify-xray]
    if: needs.discover.outputs.xray_changed == '1' && needs.qualify-xray.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Promote only the verified Xray candidate
        env:
          CANDIDATE_GATE: PASS
          MAIN_REPO_SHA: ${{ needs.discover.outputs.main_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.discover.outputs.main_sha }}
        run: |
          bash .github/scripts/promote_verified_candidate.sh \
            xray '${{ needs.discover.outputs.candidate_version }}'
      - name: Commit atomic Xray promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xray_shell_versions.json
          git commit -m "promote(xray): ${{ needs.discover.outputs.candidate_version }}"
          git push origin HEAD:main

  promote-installer:
    needs: [discover, qualify-xray, qualify-installer, promote-xray]
    if: >-
      always() && needs.discover.outputs.installer_changed == '1' &&
      needs.qualify-installer.result == 'success' &&
      (needs.discover.outputs.xray_changed != '1' ||
       needs.qualify-xray.result != 'success' ||
       needs.promote-xray.result == 'success' ||
       needs.promote-xray.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Promote only the verified installer candidate
        env:
          CANDIDATE_GATE: PASS
          MAIN_REPO_SHA: ${{ needs.discover.outputs.main_sha }}
          EXPECTED_MAIN_SHA: ${{ needs.discover.outputs.main_sha }}
          INSTALLER_SHA256: ${{ needs.discover.outputs.installer_candidate_sha }}
        run: |
          bash .github/scripts/promote_verified_candidate.sh \
            installer '${{ needs.discover.outputs.installer_candidate_ref }}'
      - name: Commit atomic installer promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xray_shell_versions.json
          git commit -m "promote(xray-install): ${{ needs.discover.outputs.installer_candidate_ref }}"
          git push origin HEAD:main
