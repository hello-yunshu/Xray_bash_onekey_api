name: Qualify legacy shell upgrades (evidence only)

on:
  workflow_call:
    inputs:
      resolved_baselines:
        description: Validated test starts selected by the caller
        required: false
        type: string
      base_version:
        required: true
        type: string
      base_installer_ref:
        required: true
        type: string
      base_installer_sha256:
        required: true
        type: string
      candidate_version:
        required: true
        type: string
      candidate_installer_ref:
        required: true
        type: string
      candidate_installer_sha256:
        required: true
        type: string
      candidate_tested_version:
        required: false
        type: string
  pull_request:
    paths:
      - compatibility-baselines.json
      - .github/scripts/qualify_legacy_upgrade.sh
      - .github/scripts/verify_shell_baselines.py
      - .github/workflows/qualify-legacy-upgrade.yml
  workflow_dispatch:
    inputs:
      base_version:
        description: Existing Xray version
        required: true
      base_installer_ref:
        description: Existing installer commit SHA
        required: true
      base_installer_sha256:
        description: Existing installer SHA-256
        required: true
      candidate_version:
        description: Candidate Xray version
        required: true
      candidate_installer_ref:
        description: Candidate installer commit SHA
        required: true
      candidate_installer_sha256:
        description: Candidate installer SHA-256
        required: true

permissions:
  contents: read

concurrency:
  group: api-legacy-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baselines:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify released baseline identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_shell_baselines.py compatibility-baselines.json
      - id: list
        env:
          RESOLVED_BASELINES: ${{ inputs.resolved_baselines }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$RESOLVED_BASELINES" ]]; then
            printf '%s\n' "$RESOLVED_BASELINES" > "$RUNNER_TEMP/selected.json"
            args+=(--selection "$RUNNER_TEMP/selected.json")
          fi
          python3 .github/scripts/select_trusted_initials.py compatibility-baselines.json "$RUNNER_TEMP/resolved-baselines.json" "${args[@]}"
          # Expand only the scenarios each baseline is allowed to run; a
          # job-level matrix condition is not available in GitHub Actions.
          matrix=$(jq -c '[.baselines[] as $baseline | $baseline.scenarios[] | {baseline: $baseline, scenario: .}]' \
            "$RUNNER_TEMP/resolved-baselines.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  legacy-upgrade:
    needs: baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.baselines.outputs.matrix) }}
    name: Legacy upgrade (${{ matrix.baseline.version }}, ${{ matrix.scenario }})
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: api
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: hello-yunshu/Xray_bash_onekey
          ref: ${{ matrix.baseline.commit }}
          path: legacy
          persist-credentials: false
      - name: Install and upgrade using the historical shell
        env:
          LEGACY_REPO: ${{ github.workspace }}/legacy
          LEGACY_INSTALL_SHA256: ${{ matrix.baseline.installSha256 }}
          UPGRADE_SCENARIO: ${{ matrix.scenario }}
          QUALIFICATION_BINARY_EVIDENCE: ${{ runner.temp }}/xray-binary.json
          XRAY_VERSIONS_FILE: ${{ github.workspace }}/api/xray_shell_versions.json
          CANDIDATE_TESTED_VERSION: ${{ inputs.candidate_tested_version }}
          BASE_XRAY_VERSION: ${{ matrix.baseline.initial.xrayVersion }}
          BASE_INSTALLER_REF: ${{ matrix.baseline.initial.installerRef }}
          BASE_INSTALLER_SHA256: ${{ matrix.baseline.initial.installerSha256 }}
          XRAY_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          XRAY_CANDIDATE_INSTALLER_REF: ${{ inputs.candidate_installer_ref }}
          XRAY_CANDIDATE_INSTALLER_SHA256: ${{ inputs.candidate_installer_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          BASELINE_VERSION: ${{ matrix.baseline.version }}
        run: |
          set -euo pipefail
          # The starting tuple belongs to the explicit historical baseline,
          # never to the current production recommendation.
          export BASE_XRAY_VERSION="${BASE_XRAY_VERSION:?Missing explicit historical initial tuple}"
          export BASE_INSTALLER_REF="${BASE_INSTALLER_REF:?Missing explicit historical initial tuple}"
          export BASE_INSTALLER_SHA256="${BASE_INSTALLER_SHA256:?Missing explicit historical initial tuple}"
          if [[ "$EVENT_NAME" == pull_request && "$CALLER_WORKFLOW" == 'Qualify legacy shell upgrades (evidence only)' ]]; then
            # Fixed negative regression fixture. Do not change this to track
            # the moving API tuple: expected failures must be reproducible.
            XRAY_CANDIDATE_VERSION=${XRAY_CANDIDATE_VERSION:-26.10.31}
            XRAY_CANDIDATE_INSTALLER_REF=${XRAY_CANDIDATE_INSTALLER_REF:-e42df6a772e60dd7b058f852262c4dbeb0bc231d}
            XRAY_CANDIDATE_INSTALLER_SHA256=${XRAY_CANDIDATE_INSTALLER_SHA256:-954666bb028ba8561b2218372b7db76ba051f8252b2db9195321e672263aab94}
            # Isolate restart recovery from the known incompatible installer.
            if [[ "$UPGRADE_SCENARIO" == restart-recovery ]]; then
              XRAY_CANDIDATE_VERSION="$BASE_XRAY_VERSION"
              XRAY_CANDIDATE_INSTALLER_REF="$BASE_INSTALLER_REF"
              XRAY_CANDIDATE_INSTALLER_SHA256="$BASE_INSTALLER_SHA256"
            fi
          fi
          export XRAY_CANDIDATE_VERSION="${XRAY_CANDIDATE_VERSION:-$(jq -r .xray_online_version "$XRAY_VERSIONS_FILE")}"
          export XRAY_CANDIDATE_INSTALLER_REF="${XRAY_CANDIDATE_INSTALLER_REF:-$(jq -r .xray_installer_ref "$XRAY_VERSIONS_FILE")}"
          export XRAY_CANDIDATE_INSTALLER_SHA256="${XRAY_CANDIDATE_INSTALLER_SHA256:-$(jq -r .xray_installer_sha256 "$XRAY_VERSIONS_FILE")}"
          if [[ -n "$CANDIDATE_TESTED_VERSION" ]]; then
            [[ "$CANDIDATE_TESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            jq --arg v "$CANDIDATE_TESTED_VERSION" '.xray_tested_version = $v' "$XRAY_VERSIONS_FILE" > "$RUNNER_TEMP/qualification-versions.json"
            export XRAY_VERSIONS_FILE="$RUNNER_TEMP/qualification-versions.json"
          fi
          if [[ "$EVENT_NAME" == pull_request && "$CALLER_WORKFLOW" == 'Qualify legacy shell upgrades (evidence only)' && "$BASELINE_VERSION" == 3.2.9 && "$UPGRADE_SCENARIO" =~ ^(fresh|direct|reinstall|fallback)$ ]]; then
            log=$(mktemp)
            trap 'rm -f "$log"' EXIT
            # shellcheck disable=SC2024 # runner owns this redirection target
            if sudo -E bash api/.github/scripts/qualify_legacy_upgrade.sh >"$log" 2>&1; then
              echo 'Expected the known incompatible combination to fail' >&2
              exit 1
            fi
            cat "$log"
            grep -Fq 'diagnostic: permission denied observed' "$log" || {
              echo 'Failure was not the expected permission incompatibility' >&2
              exit 1
            }
            echo 'PASS: known incompatible legacy combination was rejected'
          else
            sudo -E bash api/.github/scripts/qualify_legacy_upgrade.sh
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: >-
          success() && !(github.event_name == 'pull_request' &&
          github.workflow == 'Qualify legacy shell upgrades (evidence only)' &&
          matrix.baseline.version == '3.2.9' &&
          contains(fromJSON('["fresh","direct","reinstall","fallback"]'), matrix.scenario))
        with:
          name: qualification-binary-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.baseline.version }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/xray-binary.json
          if-no-files-found: error
