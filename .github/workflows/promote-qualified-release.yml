name: Publish qualified API release

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful main qualification run ID
        required: true
        type: string

concurrency:
  group: promote-qualified-api-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Resolve successful trusted qualification
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          QUAL_RUN: ${{ inputs.qualification_run }}
        run: |
          set -euo pipefail
          [[ "$QUAL_RUN" =~ ^[1-9][0-9]*$ ]]
          python3 .github/scripts/resolve_qualification_for_publish.py --run-id "$QUAL_RUN"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.qualification.outputs.sha }}
          fetch-depth: 0
      - name: Authenticate evidence, publish Release and promote the paired tuple
        env:
          GH_TOKEN: ${{ github.token }}
          QUAL_RUN: ${{ steps.qualification.outputs.run_id }}
          QUAL_ATTEMPT: ${{ steps.qualification.outputs.attempt }}
          QUAL_SHA: ${{ steps.qualification.outputs.sha }}
          QUAL_STARTED: ${{ steps.qualification.outputs.started }}
        run: |
          set -euo pipefail
          [[ "$QUAL_RUN" =~ ^[0-9]+$ && "$QUAL_ATTEMPT" =~ ^[0-9]+$ && "$QUAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUAL_STARTED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]
          [[ $(git rev-parse HEAD) == "$QUAL_SHA" ]]
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh run download "$QUAL_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "qualification-evidence-$QUAL_RUN-$QUAL_ATTEMPT" --dir "$tmp/evidence"
          evidence="$tmp/evidence/compatibility.json"
          if [[ $(jq -r '.candidate.testedVersion // .base.testedVersion' "$evidence") != $(jq -r '.base.testedVersion' "$evidence") ]]; then
            echo 'Fallback candidate is evidence only; use the tested-version promotion workflow'
            exit 0
          fi
          jq -e '{xray_online_version:.base.xrayVersion,xray_installer_ref:.base.installerRef,xray_installer_sha256:.base.installerSha256}' "$evidence" > "$tmp/expected.json"
          jq -e '{xray_online_version:.candidate.xrayVersion,xray_installer_ref:.candidate.installerRef,xray_installer_sha256:.candidate.installerSha256}' "$evidence" > "$tmp/candidate.json"
          current_tuple=$(jq -cS '{xray_online_version,xray_installer_ref,xray_installer_sha256}' xray_shell_versions.json)
          candidate_tuple=$(jq -cS . "$tmp/candidate.json")
          if [[ "$current_tuple" == "$candidate_tuple" ]]; then
            echo 'Candidate is already current; no new Release or update required'
            exit 0
          fi
          day=${QUAL_STARTED:0:10}
          tag="api-${day//-/.}.${QUAL_RUN}"
          python3 .github/scripts/publish_api_release.py \
            --tag "$tag" --evidence "$evidence" --expected "$tmp/expected.json" \
            --candidate "$tmp/candidate.json" --run-id "$QUAL_RUN" --attempt "$QUAL_ATTEMPT"
          python3 .github/scripts/stage_candidate_metadata.py \
            --current xray_shell_versions.json --expected "$tmp/expected.json" \
            --candidate "$tmp/candidate.json" --output "$tmp/staged.json"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern xray_shell_versions.json --dir "$tmp/release"
          jq -cS . "$tmp/staged.json" > "$tmp/staged.sorted"
          jq -cS . "$tmp/release/xray_shell_versions.json" > "$tmp/release.sorted"
          cmp "$tmp/staged.sorted" "$tmp/release.sorted"
          cp "$tmp/release/xray_shell_versions.json" xray_shell_versions.json
          python3 .github/scripts/record_qualified_initial.py --baselines compatibility-baselines.json --metadata xray_shell_versions.json
          bash validate-json.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add xray_shell_versions.json compatibility-baselines.json
          git commit -m "promote(xray): qualified API release $tag"
          # The checkout is the qualified main commit. A concurrent commit
          # prevents this push; do not force or rebase qualified metadata.
          git push origin HEAD:main
          curl -fsS 'https://purge.jsdelivr.net/gh/hello-yunshu/Xray_bash_onekey_api@main/xray_shell_versions.json' >/dev/null || true
