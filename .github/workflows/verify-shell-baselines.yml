name: Verify published shell baseline identities

on:
  workflow_dispatch:
  pull_request:
    paths:
      - compatibility-baselines.json
      - .github/scripts/verify_shell_baselines.py
      - .github/test/test_verify_shell_baselines.py
      - .github/workflows/verify-shell-baselines.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify published tags and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/test/test_verify_shell_baselines.py
          python3 .github/scripts/verify_shell_baselines.py compatibility-baselines.json
