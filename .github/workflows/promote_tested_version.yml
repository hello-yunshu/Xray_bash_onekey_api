name: Promote Known-Good Version

# Single-component controlled promotion of tested_version.
#
# One component per run. The online_version is NEVER auto-copied to
# tested_version. A human must explicitly promote a specific component
# +version here.
#
# Fail-closed: any upstream verification failure (network error, API rate
# limit, HTML response, missing tag/release, missing manifest, SHA mismatch,
# version mismatch) aborts the promotion. Both JSON files are restored to
# their pre-modification state on any failure.

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to promote (shell | xray | nginx | openssl | jemalloc | nginx_build)'
        required: true
        type: choice
        options:
          - shell
          - xray
          - nginx
          - openssl
          - jemalloc
          - nginx_build
      version:
        description: 'Version string to promote (must match upstream release format)'
        required: true
        type: string
      note:
        description: 'Optional reason or verification note (max 500 chars, control chars stripped)'
        required: false
        type: string
      qualification_run:
        description: 'Successful qualification run ID (required for Xray fallback)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Detect completed promotion
        id: promotion
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          source .github/scripts/promote_tested_version.sh
          validate_component "$COMPONENT"
          validate_version_format "$COMPONENT" "$VERSION"
          check_consistency tested_versions.json xray_shell_versions.json
          sanitized_note=$(sanitize_note "$NOTE")
          current_note=$(jq -r --arg f "${COMPONENT}_tested_note" '.[$f] // ""' xray_shell_versions.json)
          if [[ $(jq -r --arg c "$COMPONENT" '.[$c]' tested_versions.json) == "$VERSION" ]] &&
             [[ -z "$sanitized_note" || "$sanitized_note" == "$current_note" ]]; then
            echo "Already promoted: $COMPONENT $VERSION"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Xray fallback qualification
        id: qualification
        if: steps.promotion.outputs.needed == 'true' && inputs.component == 'xray'
        env:
          GH_TOKEN: ${{ github.token }}
          QUAL_RUN: ${{ inputs.qualification_run }}
          TARGET: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$QUAL_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ $(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha) == "$GITHUB_SHA" ]]
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUAL_RUN" --jq .run_attempt)
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUAL_RUN" --jq .created_at)
          [[ "$started" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh run download "$QUAL_RUN" --repo "$GITHUB_REPOSITORY" --name "qualification-evidence-$QUAL_RUN-$attempt" --dir "$tmp"
          python3 .github/scripts/verify_tested_promotion.py --evidence "$tmp/compatibility.json" \
            --current xray_shell_versions.json --baselines compatibility-baselines.json \
            --target "$TARGET" --run-id "$QUAL_RUN" --attempt "$attempt" --commit "$GITHUB_SHA"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "started=$started" >> "$GITHUB_OUTPUT"

      - name: Make promote script executable
        if: steps.promotion.outputs.needed == 'true'
        run: chmod +x .github/scripts/promote_tested_version.sh

      - name: Save old tested version for commit message
        if: steps.promotion.outputs.needed == 'true'
        id: old_version
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          OLD_TESTED=$(jq -r --arg c "${COMPONENT}" '.[$c]' tested_versions.json)
          echo "old_tested=${OLD_TESTED}" >> "$GITHUB_OUTPUT"
          echo "Current tested_version for ${COMPONENT}: ${OLD_TESTED}"

      - name: Promote single component (fail-closed)
        if: steps.promotion.outputs.needed == 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          NOTE: ${{ inputs.note }}
          PROMOTION_TIMESTAMP: ${{ steps.qualification.outputs.started }}
        run: |
          set -euo pipefail
          bash .github/scripts/promote_tested_version.sh "${COMPONENT}" "${VERSION}" "${NOTE}"

      - name: Verify only expected files changed
        if: steps.promotion.outputs.needed == 'true'
        run: |
          set -euo pipefail

          # Check that only the two JSON files changed (no other files)
          CHANGED=$(git status --porcelain | awk '{print $2}')
          for f in $CHANGED; do
            if [[ "$f" != "tested_versions.json" && "$f" != "xray_shell_versions.json" ]]; then
              echo "::error::Unexpected file changed: $f"
              exit 1
            fi
          done

          # A note-only promotion may leave tested_versions.json unchanged.
          if ! git diff --quiet tested_versions.json; then
            echo "✅ tested_versions.json has changes"
          else
            echo "tested_versions.json unchanged (metadata-only promotion)"
          fi

          if ! git diff --quiet xray_shell_versions.json; then
            echo "✅ xray_shell_versions.json has changes"
          else
            echo "::error::xray_shell_versions.json has no changes — promotion may have failed silently"
            exit 1
          fi

          # Validate JSON syntax
          jq empty tested_versions.json
          jq empty xray_shell_versions.json
          echo "✅ Both JSON files pass jq empty validation"

          # Run full validation script
          bash validate-json.sh
          echo "✅ validate-json.sh passed"

          # Verify only the target JSON paths changed (not other fields)
          # The promote script already does this, but we double-check here
          # to ensure no race condition or accidental modification.
          COMPONENT="${{ inputs.component }}"
          INPUT_VERSION="${{ inputs.version }}"

          # tested_versions.json: the target component key must equal input version
          ACTUAL_TESTED=$(jq -r --arg c "${COMPONENT}" '.[$c]' tested_versions.json)
          if [ "$ACTUAL_TESTED" != "$INPUT_VERSION" ]; then
            echo "::error::tested_versions.json[${COMPONENT}]='$ACTUAL_TESTED' != input '$INPUT_VERSION'"
            exit 1
          fi
          echo "✅ tested_versions.json[${COMPONENT}] = $ACTUAL_TESTED"

          # xray_shell_versions.json: the {component}_tested_version must equal input
          ACTUAL_TESTED_LONG=$(jq -r --arg f "${COMPONENT}_tested_version" '.[$f] // ""' xray_shell_versions.json)
          if [ "$ACTUAL_TESTED_LONG" != "$INPUT_VERSION" ]; then
            echo "::error::xray_shell_versions.json[${COMPONENT}_tested_version]='$ACTUAL_TESTED_LONG' != input '$INPUT_VERSION'"
            exit 1
          fi
          echo "✅ xray_shell_versions.json[${COMPONENT}_tested_version] = $ACTUAL_TESTED_LONG"

          echo "✅ All pre-commit validations passed"

      - name: Publish and verify the qualified fallback snapshot
        if: steps.promotion.outputs.needed == 'true' && inputs.component == 'xray'
        env:
          GH_TOKEN: ${{ github.token }}
          QUAL_RUN: ${{ inputs.qualification_run }}
          QUAL_ATTEMPT: ${{ steps.qualification.outputs.attempt }}
          QUAL_STARTED: ${{ steps.qualification.outputs.started }}
        run: |
          set -euo pipefail
          [[ "$QUAL_RUN" =~ ^[1-9][0-9]*$ && "$QUAL_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh run download "$QUAL_RUN" --repo "$GITHUB_REPOSITORY" --name "qualification-evidence-$QUAL_RUN-$QUAL_ATTEMPT" --dir "$tmp/evidence"
          jq -e '{xray_online_version:.base.xrayVersion,xray_installer_ref:.base.installerRef,xray_installer_sha256:.base.installerSha256}' "$tmp/evidence/compatibility.json" > "$tmp/expected.json"
          jq -e '{xray_online_version:.candidate.xrayVersion,xray_installer_ref:.candidate.installerRef,xray_installer_sha256:.candidate.installerSha256}' "$tmp/evidence/compatibility.json" > "$tmp/candidate.json"
          day=${QUAL_STARTED:0:10}
          tag="api-${day//-/.}.${QUAL_RUN}"
          python3 .github/scripts/publish_api_release.py --tag "$tag" --evidence "$tmp/evidence/compatibility.json" \
            --expected "$tmp/expected.json" --candidate "$tmp/candidate.json" --tested-metadata xray_shell_versions.json \
            --run-id "$QUAL_RUN" --attempt "$QUAL_ATTEMPT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern xray_shell_versions.json --dir "$tmp/release"
          jq -cS . xray_shell_versions.json > "$tmp/current.sorted"
          jq -cS . "$tmp/release/xray_shell_versions.json" > "$tmp/release.sorted"
          cmp "$tmp/current.sorted" "$tmp/release.sorted"
          cp "$tmp/release/xray_shell_versions.json" xray_shell_versions.json

      - name: Commit promoted version
        if: steps.promotion.outputs.needed == 'true'
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          OLD_TESTED: ${{ steps.old_version.outputs.old_tested }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tested_versions.json xray_shell_versions.json
          git commit -m "promote(${COMPONENT}): ${OLD_TESTED} → ${VERSION}

          Single-component known-good promotion.
          component: ${COMPONENT}
          old: ${OLD_TESTED}
          new: ${VERSION}
          promoted_at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
          if [[ "$COMPONENT" == xray ]]; then
            curl -fsS 'https://purge.jsdelivr.net/gh/hello-yunshu/Xray_bash_onekey_api@main/xray_shell_versions.json' >/dev/null || true
          fi
